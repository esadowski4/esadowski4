  <!-- Shooting star (SMIL) -->
  <line x1="100" y1="15" x2="100" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0">
    <animate attributeName="x2" values="100;180" dur="0.8s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="y2" values="15;50"  dur="0.8s" repeatCount="indefinite" begin="4s"/>
    <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="4s"/>
